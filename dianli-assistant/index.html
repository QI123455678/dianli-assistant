<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="电力助手" />
  <title>电力助手</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="header-title">电力助手</h1>
    <span id="header-date" class="header-date"></span>
  </header>

  <main id="main">
    <!-- 新闻简报 -->
    <section id="tab-news" class="tab-page">
      <div class="toolbar">
        <button id="btn-refresh-news" class="btn btn-primary">🔄 刷新简报</button>
        <button id="btn-share-news" class="btn btn-outline">📤 分享简报</button>
      </div>
      <p id="news-meta" class="meta"></p>
      <div id="news-list" class="list"></div>
      <div id="news-empty" class="empty hidden">
        <p>暂无简报，点击上方「刷新简报」获取今日电力新闻。</p>
      </div>
    </section>

    <!-- 工作台账 -->
    <section id="tab-ledger" class="tab-page hidden">
      <div class="toolbar">
        <button id="btn-add-record" class="btn btn-primary">＋ 记一笔</button>
        <button id="btn-import" class="btn btn-outline">📥 导入日报</button>
      </div>
      <div class="toolbar">
        <button id="btn-export" class="btn btn-outline">⬇ 导出备份</button>
        <button id="btn-restore" class="btn btn-outline">⬆ 恢复备份</button>
      </div>
      <input id="restore-file" type="file" accept=".json,application/json" class="hidden" />

      <div class="filter-row">
        <input id="ledger-search" type="search" placeholder="搜索台账（关键词）" />
        <select id="ledger-month">
          <option value="">全部月份</option>
        </select>
      </div>

      <div id="ledger-stats" class="stats"></div>
      <div id="ledger-list" class="list"></div>
      <div id="ledger-empty" class="empty hidden">
        <p>还没有记录，点击「＋ 记一笔」开始建立你的工作台账。</p>
      </div>
    </section>

    <!-- AI 辅助 -->
    <section id="tab-ai" class="tab-page hidden">
      <div class="ai-intro">
        <h2>AI 帮你干活</h2>
        <p>两种方式：把文字分享给手机自带的蓝心小V，或在下面直接和内置 AI 对话。</p>
      </div>

      <div class="toolbar">
        <button id="btn-share-ai" class="btn btn-primary">📤 分享给蓝心小V</button>
      </div>
      <textarea id="ai-share-text" class="ai-textarea" placeholder="把要交给 AI 处理的内容粘贴到这里（例如你的日报草稿），点上方按钮分享给手机 AI…"></textarea>

      <div class="divider"><span>或 直接对话内置 AI</span></div>

      <div id="ai-config" class="ai-config">
        <label for="ai-api-key">AI 接口密钥（可选，留空则只用分享功能）</label>
        <input id="ai-api-key" type="password" placeholder="粘贴你的 AI API Key" />
        <label for="ai-api-base">接口地址（默认 DeepSeek）</label>
        <input id="ai-api-base" type="text" value="https://api.deepseek.com" />
        <label for="ai-model">模型名称</label>
        <input id="ai-model" type="text" value="deepseek-chat" />
        <button id="btn-save-ai-config" class="btn btn-outline">保存设置</button>
        <p class="hint">内置 AI 需要一个 API 密钥，可在 DeepSeek 开放平台免费注册获取。</p>
      </div>

      <div id="ai-chat" class="chat">
        <div id="ai-messages" class="messages"></div>
        <div class="chat-input-row">
          <input id="ai-input" type="text" placeholder="输入你的问题…" />
          <button id="btn-ai-send" class="btn btn-primary">发送</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="news"><span class="tab-icon">📰</span><span>新闻</span></button>
    <button class="tab-btn" data-tab="ledger"><span class="tab-icon">📊</span><span>台账</span></button>
    <button class="tab-btn" data-tab="ai"><span class="tab-icon">🤖</span><span>AI</span></button>
  </nav>

  <!-- 记一笔 / 编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">记一笔</h3>
      <label for="rec-date">日期</label>
      <input id="rec-date" type="date" />
      <label for="rec-title">事项标题</label>
      <input id="rec-title" type="text" placeholder="例如：巡检 3 号主变" />
      <label for="rec-content">工作内容</label>
      <textarea id="rec-content" rows="6" placeholder="今天做了什么、结果如何…"></textarea>
      <label for="rec-tags">分类（选填）</label>
      <input id="rec-tags" type="text" placeholder="例如：巡检,检修,值班" />
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn btn-outline">取消</button>
        <button id="btn-modal-save" class="btn btn-primary">保存</button>
      </div>
      <button id="btn-modal-delete" class="btn btn-danger hidden">删除此条</button>
    </div>
  </div>

  <!-- 导入日报弹窗 -->
  <div id="import-modal" class="modal hidden">
    <div class="modal-box">
      <h3>导入工作日报</h3>
      <p class="hint">把日报内容粘贴到下面，软件会自动按「日期 + 标题 + 内容」帮你整理成台账。也可以直接上传文件（支持 .txt / .docx 文字 / .xlsx 表格）。</p>

      <label for="import-file">上传文件（.txt / .docx / .xlsx，可选）</label>
      <input id="import-file" type="file" accept=".txt,.docx,.xlsx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />

      <label for="import-text">或 粘贴日报文本</label>
      <textarea id="import-text" rows="9" placeholder="例如：&#10;2026-11-06&#10;巡检3号主变，运行正常&#10;&#10;2026-11-07&#10;处理线路故障2起"></textarea>

      <p class="hint" id="import-preview" style="display:none;"></p>

      <div class="modal-actions">
        <button id="btn-import-cancel" class="btn btn-outline">取消</button>
        <button id="btn-import-confirm" class="btn btn-primary">解析并导入</button>
      </div>
    </div>
  </div>

  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/news.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
